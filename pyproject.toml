[project]
name = "linkedin-scraper"
version = "1.0.0"
description = "Pipeline complet pour scraper LinkedIn de manière furtive, extraire les expériences, enrichir les données et produire un reporting professionnel."
authors = [{ name = "Raphaël" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "playwright",
    "pydantic",
    "openpyxl",
    "beautifulsoup4",
    "lxml",
    "tqdm",
    "python-dateutil",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
